name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  cross-build:
    name: Cross-build (ubuntu, mingw-w64, static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 cmake make
      - name: Build
        run: ./scripts/build.sh
      - name: Zero-warning gate
        run: |
          cmake --build build --clean-first -j4 2>&1 | tee build.log
          if grep -qE "warning:|error:" build.log; then echo "::error::warnings found"; exit 1; fi
      - name: Dependency audit (only OS DLLs allowed)
        run: |
          x86_64-w64-mingw32-objdump -p dist/TrayIconGuard.exe | grep "DLL Name" | sort > dlls.txt
          cat dlls.txt
          ! grep -viE "ADVAPI32|COMCTL32|COMDLG32|DWMAPI|GDI32|GDIPLUS|KERNEL32|MSVCRT|OLE32|OLEAUT32|SHELL32|SHLWAPI|USER32|VERSION|WINHTTP" dlls.txt
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrayIconGuard-win-x64
          path: |
            dist/TrayIconGuard.exe
            dist/*.zip
            dist/SHA256SUMS

  msvc-build:
    name: Native build (windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-msvc -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-msvc --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: TrayIconGuard-msvc-x64
          path: build-msvc/Release/TrayIconGuard.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross-build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: TrayIconGuard-win-x64, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrayIconGuard.exe
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
