name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  quality:
    name: Analyze + Test + Build + Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell 7.6+
        shell: pwsh
        run: |
          $v = $PSVersionTable.PSVersion
          "Runner PowerShell: $v"
          if ($v -lt [version]'7.6') {
            throw "PowerShell 7.6+ required (runner has $v). Update the runner image or install PowerShell LTS."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install QA modules
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          Install-Module Pester -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

      - name: Analyze (PSScriptAnalyzer + BAT hygiene)
        shell: pwsh
        run: ./build.ps1 -Task Analyze

      - name: Verify module
        shell: pwsh
        run: ./build.ps1 -Task Verify

      - name: Test (Pester, full functional on Windows)
        shell: pwsh
        run: ./build.ps1 -Task Test

      - name: Build EXE
        shell: pwsh
        run: ./build.ps1 -Task BuildExe -Configuration Release

      - name: Publish EXE (win-x64, self-contained single file)
        shell: pwsh
        run: ./build.ps1 -Task PublishExe -Runtime win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: ./build.ps1 -Task Package -Runtime win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShowAllTrayIcons-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Attach release assets
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ShowAllTrayIcons-win-x64
          path: dist

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
